org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Flutter 3.47.5 + AGP 9.1: official compatibility bridge.
# - newDsl=true still breaks Flutter Gradle Plugin (AbstractAppExtension cast).
# - builtInKotlin=true is OK now that camera_android_camerax 0.7.x
